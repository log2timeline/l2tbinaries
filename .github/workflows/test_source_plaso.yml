# Install Plaso from source on Ubuntu Docker images using GIFT PPA
name: test_source_plaso
on: [push]
jobs:
  test_ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['26.04']
    container:
      image: ubuntu:${{ matrix.version }}
    steps:
    - name: Set up container
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update -q
        apt-get install -y libterm-readline-gnu-perl locales software-properties-common
        locale-gen en_US.UTF-8
        ln -f -s /usr/share/zoneinfo/UTC /etc/localtime
        apt-get install -y git python3 sudo
    - name: Download Plaso source
      run: |
        BRANCH=`echo ${GITHUB_REF} | sed 's?^.*/??'`
        if test ${BRANCH} = "main"; then \
          LATEST_TAG=`git ls-remote --tags https://github.com/log2timeline/plaso.git | sort -k2 | tail -n1 | sed 's?^.*refs/tags/??'` && git clone -b ${LATEST_TAG} https://github.com/log2timeline/plaso.git; \
        else \
          git clone https://github.com/log2timeline/plaso.git; \
        fi
    - name: Install dependencies
      run: |
        export GIFT_PPA_TRACK=`echo ${GITHUB_REF} | sed 's?^.*/??;s?main?stable?'`;
        plaso/config/linux/ubuntu_install_plaso.sh
    - name: Run Plaso
      run: |
        cd plaso
        PYTHONPATH=. python3 plaso/scripts/log2timeline.py --status_view linear --storage_file test.plaso test_data/image.qcow2
        PYTHONPATH=. python3 plaso/scripts/psort.py --status_view linear -w timeline.log test.plaso
  test_windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: windows-2025
          python-version: '3.14'
    steps:
    - name: Configure git
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pywin32 to ensure sys.platform is working as expected
      shell: cmd
      env:
        PYTHON: ${{ env.pythonLocation }}
      run: |
        python -m pip install pywin32
        python "%PYTHON%\Scripts\pywin32_postinstall.py" -install
    - name: Install Plaso and dependencies
      shell: cmd
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        set "TRACK=testing"
        if /I "%BRANCH%"=="main" set "TRACK=stable"
        if /I "%BRANCH%"=="testing" set "TRACK=testing"
        if /I "%BRANCH%"=="dev" set "TRACK=dev"
        if /I "%BRANCH%"=="staging" set "TRACK=staging"
        git clone https://github.com/log2timeline/l2tdevtools.git ..\l2tdevtools
        set PYTHONPATH=..\l2tdevtools
        python ..\l2tdevtools\tools\update.py --download-directory win64 --machine-type amd64 --track "%TRACK%"
    - name: Download Plaso source
      run: |
        git clone https://github.com/log2timeline/plaso.git ../plaso
    - name: Run Plaso tests
      run: |
        cd ../plaso
        python run_tests.py
